name: CI/CD Pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Target for the live customer-journey suite'
        required: false
        default: 'https://diagnosticpro.io'
      stripe_test_mode:
        description: 'Set to "1" ONLY when the target backend runs sk_test (enables 4242 payment steps)'
        required: false
        default: ''
  schedule:
    # Weekly live-journey run (Mondays 09:15 UTC) — unpaid steps only; the
    # 4242 payment steps stay gated unless the target runs test-mode keys.
    - cron: '15 9 * * 1'

jobs:
  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./02-src/frontend
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: ./02-src/frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test
      - name: Build frontend
        run: pnpm run build
      - name: Run /audit-tests equivalent (testing-depth gates)
        run: pnpm exec audit-harness audit . --deep
        continue-on-error: true  # advisory for now

  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./02-src/backend/services/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./02-src/backend/services/backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run backend tests with coverage gate (floor enforced by jest coverageThreshold)
        run: npx jest --coverage
      - name: Verify PDF generator (legacy smoke)
        run: node -e "const {generateDiagnosticProPDF} = require('./reportPdfProduction.js'); console.log('PDF generator loaded successfully');"

  e2e:
    runs-on: ubuntu-latest
    needs: [frontend-test, backend-test]
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: ./02-src/frontend/pnpm-lock.yaml
      - name: Install backend deps
        working-directory: ./02-src/backend/services/backend
        run: npm ci
      - name: Boot backend (no LLM key — local specs never touch analysis paths)
        working-directory: ./02-src/backend/services/backend
        run: |
          NODE_ENV=test PORT=8089 \
            DB_PATH=/tmp/e2e.db REPORTS_DIR=/tmp/e2e-reports \
            node index.js &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8089/healthz && break; sleep 1;
          done
      - name: Install frontend deps + Playwright
        working-directory: ./02-src/frontend
        run: |
          pnpm install --frozen-lockfile
          npx playwright install --with-deps chromium
      - name: Build frontend (Playwright preview server serves dist/)
        working-directory: ./02-src/frontend
        run: pnpm run build
        env:
          VITE_API_BASE: ''
      - name: Run Playwright e2e
        working-directory: ./02-src/frontend
        run: npx playwright test

  # Live customer-journey suite (e2e-live/journey.spec.ts) against the deployed
  # site — real DOM, real Stripe hosted checkout (test mode when enabled), real
  # gpt-4o. Manual dispatch or weekly schedule; never on push/PR.
  live-journey:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: ./02-src/frontend/pnpm-lock.yaml
      - name: Install frontend deps + Playwright
        working-directory: ./02-src/frontend
        run: |
          pnpm install --frozen-lockfile
          npx playwright install --with-deps chromium
      - name: Run live customer-journey suite
        working-directory: ./02-src/frontend
        env:
          PLAYWRIGHT_BASE_URL: ${{ github.event.inputs.base_url || 'https://diagnosticpro.io' }}
          DPRO_STRIPE_TEST_MODE: ${{ github.event.inputs.stripe_test_mode }}
          DPRO_WHOP_TEST_TOKEN: ${{ secrets.DPRO_WHOP_TEST_TOKEN }}
          DPRO_WHOP_TEST_EMAIL: ${{ secrets.DPRO_WHOP_TEST_EMAIL }}
        run: pnpm exec playwright test --project=live-journey
      - name: Upload journey results (per-step JSON + HTML report + downloaded PDF)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-journey-${{ github.run_id }}
          path: |
            tests/live/JOURNEY-*.json
            02-src/frontend/playwright-report/
            02-src/frontend/test-results/
          if-no-files-found: warn
          retention-days: 90
