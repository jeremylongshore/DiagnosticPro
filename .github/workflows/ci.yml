name: CI/CD Pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./02-src/frontend
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: ./02-src/frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test
      - name: Build frontend
        run: pnpm run build
      - name: Run /audit-tests equivalent (testing-depth gates)
        run: pnpm exec audit-harness audit . --deep
        continue-on-error: true  # advisory for now

  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./02-src/backend/services/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./02-src/backend/services/backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run backend tests (including new self-host SQLite layer)
        run: npm test
      - name: Verify PDF generator (legacy smoke)
        run: node -e "const {generateDiagnosticProPDF} = require('./reportPdfProduction.js'); console.log('PDF generator loaded successfully');"
