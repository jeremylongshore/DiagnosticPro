# Self-hosted deployment for DiagnosticPro on the Intent Solutions VPS.
# Listens only on 127.0.0.1 (Caddy reverse-proxies from outside).
#
# Usage on VPS (after sops materialize + git clone at /srv/code/diagnostic-pro):
#   docker compose pull || docker compose build
#   docker compose up -d
#   docker compose ps
#
# Health: http://127.0.0.1:8089/healthz  (adjust port)
#
# LLM (OpenAI gpt-4o default, via the OpenAI-compatible client):
#   LLM_API_KEY + LLM_BASE_URL=https://api.openai.com/v1 + LLM_MODEL=gpt-4o
#   Groq:   LLM_BASE_URL=https://api.groq.com/openai/v1 + GROQ_API_KEY
#   xAI:    LLM_BASE_URL=https://api.x.ai/v1 + LLM_MODEL=grok-4 + xAI key
#   Ollama: LLM_BASE_URL=http://127.0.0.1:11434/v1  (mount a sidecar for 100% local)
#
# Reports + DB: fully local on VPS volume (no GCS, no Firestore).
#
# Frontend (self-hosted):
#   1. cd 02-src/frontend && VITE_API_BASE= npm run build
#   2. The dist/ is served by Caddy (recommended) or the example frontend service below.
#   Set VITE_API_BASE='' (empty) for same-origin API calls (Caddy proxies /saveSubmission etc to backend).
#
# See: ~/000-projects/intent-os/ops/deploy/
#      ~/000-projects/intent-os/ops/host/
#      Caddy block example in runbook or /etc/caddy/sites/diagnosticpro.caddy

services:
  backend:
    build:
      context: ./02-src/backend/services/backend
      dockerfile: Dockerfile
      args:
        # Supplied by the VPS deploy script (export GIT_SHA=$NEW_HEAD before
        # `docker compose up --build`). Falls back to 'unknown' for local builds.
        # Surfaced at GET /healthz .gitSha and asserted by deploy.yml's
        # test-surface-parity job.
        GIT_SHA: ${GIT_SHA:-unknown}
    # Named explicitly so backend-test can pin the exact same image and both
    # surfaces are provably one build.
    image: diagnosticpro-backend:latest
    container_name: diagnosticpro-backend
    restart: unless-stopped
    ports:
      # Bind localhost only — Caddy is the public face
      - "127.0.0.1:8089:8080"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DB_PATH=/data/diagnosticpro.db
      # Photo-evidence storage — MUST live on the persistent volume or uploads
      # are lost on container restart. Sweeper (EVIDENCE_ORPHAN_TTL_HOURS) deletes
      # unpaid pending submissions after the TTL window.
      - EVIDENCE_UPLOADS_DIR=/data/uploads
      - EVIDENCE_ORPHAN_TTL_HOURS=48
      # LLM (OpenAI gpt-4o default) — real values come from .env (SOPS-materialized)
      # - LLM_BASE_URL=https://api.openai.com/v1
      # - LLM_MODEL=gpt-4o
    volumes:
      # SQLite DB + local reports (no GCS)
      - diagnosticpro-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8080/healthz', (r) => r.statusCode === 200 ? process.exit(0) : process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # test.diagnosticpro.io — the Stripe TEST-MODE surface (sk_test), used by the
  # live customer-journey and photo-attach Playwright suites.
  #
  # WHY THIS IS HERE AT ALL: this container used to be created by hand. It was
  # spawned 2026-07-23, carried a compose project label but an EMPTY
  # project.config_files label, and appeared in no compose file — so the deploy's
  # `docker compose up -d --build`, which only ever knew about `backend`, could
  # not see it, adopt it, or replace it. It sat pinned to a superseded image id
  # for three weeks while prod moved on, and POST /evidence/:id/document returned
  # 404 there while prod returned 400. Declaring it here is the fix: it now
  # converges on every deploy like any other service. Do NOT give it a
  # `profiles:` key — the deploy runs a bare `up`, and a profiled service would
  # silently never start, reintroducing exactly this drift.
  backend-test:
    # Same image tag as `backend`, and deliberately NO second `build:` block.
    # Both surfaces are then provably one build, and the deploy does not pay for
    # a second cold texlive layer.
    image: diagnosticpro-backend:latest
    container_name: diagnosticpro-backend-test
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # Caddy's test.diagnosticpro.io block proxies here.
      - "127.0.0.1:8093:8080"
    env_file:
      # sk_test lives here; prod's sk_live lives in .env. These files must never
      # be listed together on one service — compose merges env_file left to right
      # and would silently mix the two key sets across the live/test boundary.
      # `required: false` confines a missing file to THIS container instead of
      # failing the whole compose run and taking the deploy down with it.
      - path: .env.test
        required: false
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DB_PATH=/data/diagnosticpro.db
      - EVIDENCE_UPLOADS_DIR=/data/uploads
      - EVIDENCE_ORPHAN_TTL_HOURS=48
    volumes:
      # Its OWN volume. Test submissions must never touch the production DB.
      - diagnosticpro-test-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8080/healthz', (r) => r.statusCode === 200 ? process.exit(0) : process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Optional: static frontend container (for local testing).
# In production on VPS, build dist/ and let Caddy serve it directly + proxy API.
#   frontend:
#     image: nginx:alpine
#     volumes:
#       - ./02-src/frontend/dist:/usr/share/nginx/html:ro
#     ports:
#       - "127.0.0.1:8090:80"

volumes:
  diagnosticpro-data:
  diagnosticpro-test-data:
