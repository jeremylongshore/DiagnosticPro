# SOPS configuration for DiagnosticPro
# Follows Intent Solutions standard (age + sops). See runbook docs/secrets-inventory.md
# and onboarding for VPS deploys.
#
# Encrypt: sops -e .env > .env.sops   (or use scripts/sops-env)
# On VPS: scripts/sops-env --materialize   (writes to runtime .env)
#
# CI / GitHub: set SOPS_AGE_KEY secret (private key for the recipients below).

